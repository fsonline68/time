<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Zeit</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; }
      .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
      .timer { font-size: 3.5rem; text-align: center; margin: 20px 0; font-family: monospace; font-weight: bold; color: #1a1a1a; }
      .status-label { text-align: center; font-weight: bold; text-transform: uppercase; color: #666; margin-top: 10px; }
      .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        button { padding: 15px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; transition: background 0.2s; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
      .btn-start { background: #22c55e; color: white; grid-column: span 2; }
      .btn-pause { background: #f59e0b; color: white; }
      .btn-stop { background: #ef4444; color: white; }
      .btn-csv { background: #64748b; color: white; grid-column: span 2; margin-top: 10px; }
      .stats { margin-top: 25px; border-top: 1px solid #eee; padding-top: 15px; }
      .stats-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="status" class="status-label">BEREIT</div>
        <div class="timer" id="display">00:00:00</div>
        
        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="clockIn()">START</button>
            <button class="btn-pause" id="pauseBtn" onclick="togglePause()" disabled>PAUSE</button>
            <button class="btn-stop" id="stopBtn" onclick="clockOut()" disabled>STOPP</button>
            <button class="btn-csv" onclick="exportCSV()">CSV EXPORT</button>
        </div>

        <div class="stats" id="statsArea">
            <strong>Fortschreibung (Netto):</strong>
            <div id="statsContent" style="margin-top:10px;">Lade Daten...</div>
        </div>
    </div>

    <script>
        // HIER WAR DER FEHLER: Korrekte Initialisierung des Speichers
        let entries = JSON.parse(localStorage.getItem('time_tracker_v1') |

| '');
        let timerInterval;

        function save() {
            localStorage.setItem('time_tracker_v1', JSON.stringify(entries));
            renderStats();
        }

        function clockIn() {
            if (entries.length > 0 &&!entries[entries.length-1].end) return;
            entries.push({ type: 'WORK', start: Date.now(), end: null });
            updateUI('WORKING');
            save();
        }

        function togglePause() {
            const last = entries[entries.length - 1];
            if (!last |

| last.end) return;
            
            last.end = Date.now();
            const nextType = (last.type === 'WORK')? 'BREAK' : 'WORK';
            entries.push({ type: nextType, start: Date.now(), end: null });
            
            updateUI(nextType === 'BREAK'? 'PAUSED' : 'WORKING');
            save();
        }

        function clockOut() {
            const last = entries[entries.length - 1];
            if (last &&!last.end) {
                last.end = Date.now();
            }
            updateUI('IDLE');
            save();
        }

        function updateUI(state) {
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const stopBtn = document.getElementById('stopBtn');
            const statusLabel = document.getElementById('status');

            if (state === 'IDLE') {
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                stopBtn.disabled = true;
                statusLabel.innerText = "BEREIT";
                statusLabel.style.color = "#666";
                clearInterval(timerInterval);
                document.getElementById('display').innerText = "00:00:00";
            } else {
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                stopBtn.disabled = false;
                pauseBtn.innerText = (state === 'PAUSED')? 'WEITER' : 'PAUSE';
                statusLabel.innerText = (state === 'PAUSED')? 'PAUSE' : 'ARBEIT';
                statusLabel.style.color = (state === 'PAUSED')? '#f59e0b' : '#22c55e';
                
                clearInterval(timerInterval);
                timerInterval = setInterval(updateTimerDisplay, 1000);
            }
        }

        function updateTimerDisplay() {
            const last = entries[entries.length - 1];
            if (!last) return;
            const diff = Date.now() - last.start;
            const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            document.getElementById('display').innerText = `${h}:${m}:${s}`;
        }

        function renderStats() {
            const now = new Date();
            let totals = { day: 0, week: 0, month: 0 };

            entries.forEach(e => {
                if (e.type === 'WORK' && e.end) {
                    const d = new Date(e.start);
                    const duration = e.end - e.start;
                    if (d.toDateString() === now.toDateString()) totals.day += duration;
                    // Vereinfachte Wochenprüfung
                    if (now - d < 7 * 86400000) totals.week += duration;
                    if (d.getMonth() === now.getMonth()) totals.month += duration;
                }
            });

            document.getElementById('statsContent').innerHTML = `
                <div class="stats-row"><span>Heute:</span> <strong>${(totals.day/3600000).toFixed(2)}h</strong></div>
                <div class="stats-row"><span>Diese Woche:</span> <strong>${(totals.week/3600000).toFixed(2)}h</strong></div>
                <div class="stats-row"><span>Diesen Monat:</span> <strong>${(totals.month/3600000).toFixed(2)}h</strong></div>
            `;
        }

        function exportCSV() {
            let csv = "\ufeffDatum;Typ;Start;Ende;Dauer(Min)\n";
            entries.forEach(e => {
                const dur = e.end? Math.round((e.end - e.start) / 60000) : 0;
                csv += `${new Date(e.start).toLocaleDateString()};${e.type};${new Date(e.start).toLocaleTimeString()};${e.end? new Date(e.end).toLocaleTimeString() : '-'};${dur}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Zeiterfassung_${new Date().toISOString().split('T')}.csv`;
            link.click();
        }

        // Automatischer Resume beim Neuladen
        if (entries.length > 0 &&!entries[entries.length-1].end) {
            updateUI(entries[entries.length-1].type === 'WORK'? 'WORKING' : 'PAUSED');
        } else {
            renderStats();
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
