<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeit-Tracker</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        :root { --green: #22c55e; --red: #ef4444; --amber: #f59e0b; --slate: #64748b; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #f1f5f9; padding: 20px; display: flex; flex-direction: column; align-items: center; }
     .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
     .timer { font-size: 3.5rem; font-weight: 700; text-align: center; margin: 20px 0; font-variant-numeric: tabular-nums; color: #0f172a; }
     .status { display: block; width: fit-content; margin: 0 auto 10px; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; background: #e2e8f0; color: #64748b; }
     .working { background: #dcfce7; color: #166534; }
     .paused { background: #fef3c7; color: #92400e; }
     .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button { padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: opacity 0.2s; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
     .btn-start { background: var(--green); color: white; grid-column: span 2; }
     .btn-pause { background: var(--amber); color: white; }
     .btn-stop { background: var(--red); color: white; }
     .btn-csv { background: var(--slate); color: white; width: 100%; margin-top: 15px; }
     .stats { margin-top: 25px; border-top: 1px solid #e2e8f0; padding-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <div id="statusLabel" class="status">BEREIT</div>
    <div class="timer" id="display">00:00:00</div>

    <div class="controls">
        <button class="btn-start" id="startBtn" onclick="clockIn()">START</button>
        <button class="btn-pause" id="pauseBtn" onclick="togglePause()" disabled>PAUSE</button>
        <button class="btn-stop" id="stopBtn" onclick="clockOut()" disabled>STOPP</button>
    </div>

    <button class="btn-csv" onclick="exportCSV()">CSV EXPORT</button>

    <div class="stats">
        <strong>Heute gearbeitet:</strong> <span id="todayDisplay">0.00h</span>
    </div>
</div>

<script>
    // INITIALISIERUNG (FIXED: JSON Syntax & Empty Array)
    let entries = []; // Fixed: Initialized to an empty array
    try {
        const data = localStorage.getItem('time_tracker_v7');
        if (data) {
            entries = JSON.parse(data);
        }
    } catch (e) {
        entries = []; // Fixed: Initialized to an empty array
    }

    let timerInterval;

    function save() {
        localStorage.setItem('time_tracker_v7', JSON.stringify(entries));
        renderStats();
    }

    function clockIn() {
        if (entries.length > 0 && !entries[entries.length - 1].end) return; // Fixed: Corrected boolean operator
        entries.push({ type: 'WORK', start: Date.now(), end: null });
        updateUI();
        save();
    }

    function togglePause() {
        const last = entries[entries.length - 1];
        if (!last || last.end) return; // Fixed: Corrected boolean operator

        const now = Date.now();
        last.end = now;
        const nextType = (last.type === 'WORK')? 'BREAK' : 'WORK';
        entries.push({ type: nextType, start: now, end: null });

        updateUI();
        save();
    }

    function clockOut() {
        const last = entries[entries.length - 1];
        if (last && !last.end) { // Fixed: Corrected boolean operator
            last.end = Date.now();
        }
        updateUI();
        save();
    }

    function updateUI() {
        const last = entries.length > 0? entries[entries.length - 1] : null;
        const isRunning = last && !last.end; // Fixed: Corrected boolean operator

        document.getElementById('startBtn').disabled = isRunning;
        document.getElementById('pauseBtn').disabled = !isRunning; // Fixed: Corrected boolean operator
        document.getElementById('stopBtn').disabled = !isRunning; // Fixed: Corrected boolean operator

        const label = document.getElementById('statusLabel');
        if (!isRunning) { // Fixed: Corrected boolean operator
            label.innerText = "BEREIT";
            label.className = "status";
            clearInterval(timerInterval);
            document.getElementById('display').innerText = "00:00:00";
        } else {
            const isPaused = (last.type === 'BREAK');
            label.innerText = isPaused? "PAUSE" : "ARBEIT";
            label.className = "status " + (isPaused? "paused" : "working");
            document.getElementById('pauseBtn').innerText = isPaused? "WEITER" : "PAUSE";

            clearInterval(timerInterval);
            timerInterval = setInterval(tick, 1000);
            tick();
        }
    }

    function tick() {
        const last = entries[entries.length - 1];
        if (!last || last.end) return; // Fixed: Corrected boolean operator
        const diff = Date.now() - last.start;
        const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
        const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
        const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
        document.getElementById('display').innerText = h + ":" + m + ":" + s;
    }

    function renderStats() {
        const startOfDay = new Date().setHours(0,0,0,0);
        let totalMs = 0;
        entries.forEach(e => {
            if (e.type === 'WORK' && e.end && e.start >= startOfDay) {
                totalMs += (e.end - e.start);
            }
        });
        document.getElementById('todayDisplay').innerText = (totalMs / 3600000).toFixed(2) + "h";
    }

    function exportCSV() {
        if (entries.length === 0) return alert("Keine Daten vorhanden.");
        let csv = "\ufeffDatum;Typ;Start;Ende;Dauer(Min)\n";
        entries.forEach(e => {
            const d = new Date(e.start);
            const dur = e.end? Math.round((e.end - e.start) / 60000) : 0;
            csv += d.toLocaleDateString() + ";" + e.type + ";" + d.toLocaleTimeString() + ";" + (e.end? new Date(e.end).toLocaleTimeString() : "-") + ";" + dur + "\n";
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "arbeitszeit.csv";
        a.click();
    }

    // Registrierung Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    updateUI();
    renderStats();
</script>
</body>
</html>
