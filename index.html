<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mein Zeit-Tracker</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        :root { --green: #22c55e; --red: #ef4444; --amber: #f59e0b; --slate: #64748b; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #f1f5f9; padding: 20px; display: flex; flex-direction: column; align-items: center; }
       .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
       .timer { font-size: 3.5rem; font-weight: 700; text-align: center; margin: 20px 0; font-variant-numeric: tabular-nums; color: #0f172a; }
       .badge { display: block; width: fit-content; margin: 0 auto 10px; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; background: #e2e8f0; color: #64748b; }
       .working { background: #dcfce7; color: #166534; }
       .paused { background: #fef3c7; color: #92400e; }
       .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button { padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
       .btn-start { background: var(--green); color: white; grid-column: span 2; }
       .btn-pause { background: var(--amber); color: white; }
       .btn-stop { background: var(--red); color: white; }
       .btn-csv { background: var(--slate); color: white; width: 100%; margin-top: 15px; }
       .stats { margin-top: 25px; border-top: 1px solid #e2e8f0; padding-top: 15px; }
       .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="card">
    <div id="status" class="badge">BEREIT</div>
    <div class="timer" id="display">00:00:00</div>
    
    <div class="controls">
        <button class="btn-start" id="startBtn" onclick="clockIn()">START</button>
        <button class="btn-pause" id="pauseBtn" onclick="togglePause()" disabled>PAUSE</button>
        <button class="btn-stop" id="stopBtn" onclick="clockOut()" disabled>STOPP</button>
    </div>

    <button class="btn-csv" onclick="exportCSV()">CSV EXPORT</button>

    <div class="stats">
        <strong>Fortschreibung:</strong>
        <div id="statsContent" style="margin-top:10px;">Lade...</div>
    </div>
</div>

<script>
    // SICHERE INITIALISIERUNG
    let entries =;
    try {
        const data = localStorage.getItem('my_time_data_v3');
        if (data) entries = JSON.parse(data);
    } catch (e) {
        console.error("Speicher-Fehler", e);
        entries =;
    }

    let timerInterval;

    function save() {
        localStorage.setItem('my_time_data_v3', JSON.stringify(entries));
        renderStats();
    }

    function clockIn() {
        if (entries.length > 0 &&!entries[entries.length-1].end) return;
        entries.push({ type: 'WORK', start: Date.now(), end: null });
        updateUI();
        save();
    }

    function togglePause() {
        const last = entries[entries.length - 1];
        if (!last |

| last.end) return;
        last.end = Date.now();
        const nextType = (last.type === 'WORK')? 'BREAK' : 'WORK';
        entries.push({ type: nextType, start: Date.now(), end: null });
        updateUI();
        save();
    }

    function clockOut() {
        const last = entries[entries.length - 1];
        if (last &&!last.end) last.end = Date.now();
        updateUI();
        save();
    }

    function updateUI() {
        const last = entries.length > 0? entries[entries.length - 1] : null;
        const isRunning = last &&!last.end;
        
        document.getElementById('startBtn').disabled = isRunning;
        document.getElementById('pauseBtn').disabled =!isRunning;
        document.getElementById('stopBtn').disabled =!isRunning;

        const statusLabel = document.getElementById('status');
        if (!isRunning) {
            statusLabel.innerText = "BEREIT";
            statusLabel.className = "badge";
            clearInterval(timerInterval);
            document.getElementById('display').innerText = "00:00:00";
        } else {
            const isPaused = (last.type === 'BREAK');
            statusLabel.innerText = isPaused? "PAUSE" : "ARBEIT";
            statusLabel.className = "badge " + (isPaused? "paused" : "working");
            document.getElementById('pauseBtn').innerText = isPaused? "WEITER" : "PAUSE";
            
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
            updateTimer();
        }
    }

    function updateTimer() {
        const last = entries[entries.length - 1];
        const diff = Date.now() - last.start;
        const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
        const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
        const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
        document.getElementById('display').innerText = `${h}:${m}:${s}`;
    }

    function renderStats() {
        const now = new Date();
        const startOfDay = new Date().setHours(0,0,0,0);
        let todayMs = 0;

        entries.forEach(e => {
            if (e.type === 'WORK' && e.end && e.start >= startOfDay) {
                todayMs += (e.end - e.start);
            }
        });

        document.getElementById('statsContent').innerHTML = `
            <div class="stat-row"><span>Heute gearbeitet:</span> <b>${(todayMs/3600000).toFixed(2)}h</b></div>
        `;
    }

    function exportCSV() {
        let csv = "\ufeffDatum;Typ;Start;Ende;Dauer(Min)\n";
        entries.forEach(e => {
            const dur = e.end? Math.round((e.end - e.start) / 60000) : 0;
            const d = new Date(e.start);
            csv += `${d.toLocaleDateString()};${e.type};${d.toLocaleTimeString()};${e.end? new Date(e.end).toLocaleTimeString() : '-'};${dur}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "zeiterfassung.csv";
        a.click();
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    updateUI();
    renderStats();
</script>
</body>
</html>
