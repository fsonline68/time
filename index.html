<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeitTracker Privat</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        :root { --primary: #2563eb; --success: #22c55e; --danger: #ef4444; --warning: #f59e0b; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; color: #1e293b; padding: 15px; display: flex; flex-direction: column; align-items: center; }
      .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
      .timer { font-size: 3.5rem; font-weight: 800; text-align: center; margin: 20px 0; font-family: monospace; color: #0f172a; }
      .status-badge { text-align: center; font-weight: bold; padding: 5px 12px; border-radius: 20px; display: inline-block; width: fit-content; margin: 0 auto 10px; font-size: 0.8rem; }
      .idle { background: #e2e8f0; color: #64748b; }
      .working { background: #dcfce7; color: #166534; }
      .paused { background: #fef3c7; color: #92400e; }
      .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button { padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: transform 0.1s, opacity 0.2s; -webkit-tap-highlight-color: transparent; }
        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
      .btn-start { background: var(--success); color: white; grid-column: span 2; }
      .btn-pause { background: var(--warning); color: white; }
      .btn-stop { background: var(--danger); color: white; }
      .btn-csv { background: #64748b; color: white; width: 100%; margin-top: 15px; }
      .stats { margin-top: 25px; border-top: 2px solid #f1f5f9; padding-top: 15px; }
      .stat-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 0.95rem; }
      .debug-log { font-size: 0.7rem; color: #94a3b8; margin-top: 20px; width: 100%; max-width: 400px; max-height: 100px; overflow-y: auto; background: #fff; padding: 5px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <center><div id="status" class="status-badge idle">BEREIT</div></center>
        <div class="timer" id="display">00:00:00</div>
        
        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="clockIn()">ARBEIT STARTEN</button>
            <button class="btn-pause" id="pauseBtn" onclick="togglePause()" disabled>PAUSE</button>
            <button class="btn-stop" id="stopBtn" onclick="clockOut()" disabled>STOPP</button>
        </div>

        <button class="btn-csv" onclick="exportCSV()">CSV EXPORT (.csv)</button>

        <div class="stats" id="statsContainer">
            <strong>Fortschreibung:</strong>
            <div id="statsContent" style="margin-top:8px;">Lade...</div>
        </div>
        
        <button style="background:none; color:#cbd5e1; font-size:0.6rem; border:none; margin-top:20px; width:100%;" onclick="clearData()">Daten löschen</button>
    </div>

    <div id="debug" class="debug-log">Log: App initialisiert...</div>

    <script>
        // KORREKTE INITIALISIERUNG
        let entries =;
        try {
            const saved = localStorage.getItem('arbeitszeit_data_v2');
            entries = saved? JSON.parse(saved) :;
            log("Daten geladen: " + entries.length + " Einträge");
        } catch(e) {
            log("Fehler beim Laden: " + e.message);
            entries =;
        }

        let timerInterval;

        function log(msg) {
            const d = document.getElementById('debug');
            d.innerText += "\n> " + msg;
            d.scrollTop = d.scrollHeight;
        }

        function save() {
            localStorage.setItem('arbeitszeit_data_v2', JSON.stringify(entries));
            renderStats();
        }

        function clockIn() {
            if (entries.length > 0 &&!entries[entries.length-1].end) return;
            entries.push({ type: 'WORK', start: Date.now(), end: null });
            log("Start Arbeit");
            updateUI();
            save();
        }

        function togglePause() {
            const last = entries[entries.length - 1];
            if (!last |

| last.end) return;
            
            const now = Date.now();
            last.end = now;
            const newType = (last.type === 'WORK')? 'BREAK' : 'WORK';
            entries.push({ type: newType, start: now, end: null });
            
            log("Wechsel zu: " + newType);
            updateUI();
            save();
        }

        function clockOut() {
            const last = entries[entries.length - 1];
            if (last &&!last.end) {
                last.end = Date.now();
            }
            log("Stopp Arbeit");
            updateUI();
            save();
        }

        function updateUI() {
            const last = (entries.length > 0)? entries[entries.length - 1] : null;
            const isRunning = last &&!last.end;
            
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const stopBtn = document.getElementById('stopBtn');
            const statusLabel = document.getElementById('status');

            if (!isRunning) {
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                stopBtn.disabled = true;
                statusLabel.innerText = "BEREIT";
                statusLabel.className = "status-badge idle";
                clearInterval(timerInterval);
                document.getElementById('display').innerText = "00:00:00";
            } else {
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                stopBtn.disabled = false;
                
                const isPaused = (last.type === 'BREAK');
                statusLabel.innerText = isPaused? "IN PAUSE" : "AM ARBEITEN";
                statusLabel.className = "status-badge " + (isPaused? "paused" : "working");
                pauseBtn.innerText = isPaused? "WEITER" : "PAUSE";

                clearInterval(timerInterval);
                timerInterval = setInterval(updateTimerDisplay, 1000);
                updateTimerDisplay();
            }
        }

        function updateTimerDisplay() {
            const last = entries[entries.length - 1];
            if (!last |

| last.end) return;
            const diff = Date.now() - last.start;
            const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            document.getElementById('display').innerText = `${h}:${m}:${s}`;
        }

        function renderStats() {
            const now = new Date();
            const startOfDay = new Date().setHours(0,0,0,0);
            const startOfWeek = new Date().setDate(now.getDate() - now.getDay() + (now.getDay() === 0? -6 : 1));
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

            let totals = { day: 0, week: 0, month: 0 };

            entries.forEach(e => {
                if (e.type === 'WORK' && e.end) {
                    const dur = e.end - e.start;
                    if (e.start >= startOfDay) totals.day += dur;
                    if (e.start >= startOfWeek) totals.week += dur;
                    if (e.start >= startOfMonth) totals.month += dur;
                }
            });

            document.getElementById('statsContent').innerHTML = `
                <div class="stat-row"><span>Heute:</span> <b>${(totals.day/3600000).toFixed(2)}h</b></div>
                <div class="stat-row"><span>Woche:</span> <b>${(totals.week/3600000).toFixed(2)}h</b></div>
                <div class="stat-row"><span>Monat:</span> <b>${(totals.month/3600000).toFixed(2)}h</b></div>
            `;
        }

        function exportCSV() {
            if (entries.length === 0) return alert("Keine Daten vorhanden.");
            let csv = "\ufeffDatum;Typ;Start;Ende;Dauer(Min)\n";
            entries.forEach(e => {
                const dur = e.end? Math.round((e.end - e.start) / 60000) : 0;
                const d = new Date(e.start);
                csv += `${d.toLocaleDateString()};${e.type};${d.toLocaleTimeString()};${e.end? new Date(e.end).toLocaleTimeString() : '-'};${dur}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `Zeiterfassung_${new Date().toISOString().split('T')}.csv`;
            link.click();
            log("CSV Export gestartet");
        }

        function clearData() {
            if (confirm("Alle Daten wirklich löschen?")) {
                entries =;
                save();
                updateUI();
                log("Speicher geleert");
            }
        }

        // Service Worker mit Fehlerbehandlung
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(e => log("SW Fehler: " + e.message));
        }

        updateUI();
        renderStats();
    </script>
</body>
</html>
