<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeit-Tracker</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        body { font-family: sans-serif; background: #f1f5f9; padding: 20px; display: flex; flex-direction: column; align-items: center; }
      .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
      .timer { font-size: 3rem; text-align: center; margin: 20px 0; font-family: monospace; font-weight: bold; }
      .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: 0.3; }
      .btn-start { background: #22c55e; color: white; grid-column: span 2; }
      .btn-pause { background: #f59e0b; color: white; }
      .btn-stop { background: #ef4444; color: white; }
      .btn-csv { background: #64748b; color: white; width: 100%; margin-top: 15px; }
      .stats { margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <div id="status" style="text-align:center; color:#64748b; font-weight:bold;">BEREIT</div>
        <div class="timer" id="display">00:00:00</div>
        
        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="clockIn()">START</button>
            <button class="btn-pause" id="pauseBtn" onclick="togglePause()" disabled>PAUSE</button>
            <button class="btn-stop" id="stopBtn" onclick="clockOut()" disabled>STOPP</button>
        </div>

        <button class="btn-csv" onclick="exportCSV()">CSV EXPORT</button>

        <div class="stats">
            <strong>Heute:</strong> <span id="todayTotal">0.00h</span>
        </div>
    </div>

    <script>
        // DATEN-INITIALISIERUNG (KORRIGIERT)
        let entries =;
        try {
            const saved = localStorage.getItem('time_v5_data');
            if (saved) {
                entries = JSON.parse(saved);
            }
        } catch (e) {
            entries =;
        }

        let timerInterval;

        function save() {
            localStorage.setItem('time_v5_data', JSON.stringify(entries));
            renderStats();
        }

        function clockIn() {
            const last = entries[entries.length - 1];
            if (last &&!last.end) return;
            entries.push({ type: 'WORK', start: Date.now(), end: null });
            updateUI();
            save();
        }

        function togglePause() {
            const last = entries[entries.length - 1];
            if (!last |

| last.end) return;
            
            const now = Date.now();
            last.end = now;
            const nextType = (last.type === 'WORK')? 'BREAK' : 'WORK';
            entries.push({ type: nextType, start: now, end: null });
            updateUI();
            save();
        }

        function clockOut() {
            const last = entries[entries.length - 1];
            if (last &&!last.end) {
                last.end = Date.now();
            }
            updateUI();
            save();
        }

        function updateUI() {
            const last = entries.length > 0? entries[entries.length - 1] : null;
            const isRunning = (last &&!last.end);
            
            document.getElementById('startBtn').disabled = isRunning;
            document.getElementById('pauseBtn').disabled =!isRunning;
            document.getElementById('stopBtn').disabled =!isRunning;

            if (!isRunning) {
                document.getElementById('status').innerText = "BEREIT";
                clearInterval(timerInterval);
                document.getElementById('display').innerText = "00:00:00";
            } else {
                const isPaused = (last.type === 'BREAK');
                document.getElementById('status').innerText = isPaused? "PAUSE" : "ARBEIT";
                document.getElementById('pauseBtn').innerText = isPaused? "WEITER" : "PAUSE";
                
                clearInterval(timerInterval);
                timerInterval = setInterval(tick, 1000);
                tick();
            }
        }

        function tick() {
            const last = entries[entries.length - 1];
            const diff = Date.now() - last.start;
            const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            document.getElementById('display').innerText = h + ":" + m + ":" + s;
        }

        function renderStats() {
            const startOfDay = new Date().setHours(0,0,0,0);
            let ms = 0;
            entries.forEach(e => {
                if (e.type === 'WORK' && e.end && e.start >= startOfDay) {
                    ms += (e.end - e.start);
                }
            });
            document.getElementById('todayTotal').innerText = (ms / 3600000).toFixed(2) + "h";
        }

        function exportCSV() {
            let csv = "\ufeffDatum;Typ;Start;Ende;Minuten\n";
            entries.forEach(e => {
                const d = new Date(e.start);
                const dur = e.end? Math.round((e.end - e.start) / 60000) : 0;
                csv += d.toLocaleDateString() + ";" + e.type + ";" + d.toLocaleTimeString() + ";" + (e.end? new Date(e.end).toLocaleTimeString() : "-") + ";" + dur + "\n";
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "zeit.csv";
            a.click();
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }

        updateUI();
        renderStats();
    </script>
</body>
</html>
